<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Rokar POS — Billing, Udhaar Khata &amp; Stock Software for Shops in Pakistan</title>
    <meta
      name="description"
      content="Offline billing, udhaar khata, stock audit aur daily profit reports — Windows 10/11 ke liye. 15 din ka free trial, koi signup nahi, aur internet sirf backup ke liye chahiye."
    />
    <!-- Long-tail terms the page actually covers. Kept short: a stuffed keyword
         list reads as spam and modern Google ignores the meta keywords tag. -->
    <meta
      name="keywords"
      content="billing software Pakistan, udhaar khata software, grocery POS, pharmacy billing software, retail POS Lahore, offline billing app, thermal receipt software"
    />
    <meta name="author" content="Rokar POS" />
    <meta name="theme-color" content="#041c15" />
    <meta name="color-scheme" content="light dark" />
    <!-- max-image-preview:large lets Google show the receipt screenshots from the
         product tour in search results instead of a thumbnail. -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Local SEO: tells Google this is a Pakistan-facing product. -->
    <meta name="geo.region" content="PK" />
    <meta name="geo.placename" content="Pakistan" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rokar POS" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:url" content="https://rokarpos.co.uk/" />
    <meta property="og:title" content="Rokar POS — Apni Dukaan Ka Poora Hisaab, Ek Screen Par" />
    <meta
      property="og:description"
      content="100% Offline POS software with fast billing, udhaar khata, stock audit, thermal receipts &amp; WhatsApp billing. 15 din ka free trial."
    />
    <meta property="og:image" content="https://rokarpos.co.uk/og-cover.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Rokar POS wordmark with real screenshots of the dashboard and billing screens, shown with sample data"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rokar POS — Billing &amp; Inventory Software for Pakistani Shops" />
    <meta
      name="twitter:description"
      content="Fast offline billing, udhaar khata and stock audit for retail stores in Pakistan."
    />
    <meta name="twitter:image" content="https://rokarpos.co.uk/og-cover.png" />
    <meta
      name="twitter:image:alt"
      content="Rokar POS wordmark with real screenshots of the dashboard and billing screens, shown with sample data"
    />

    <!-- Canonical: both rokarpos.co.uk and www.rokarpos.co.uk are served,
         this tells search engines which one is the primary. -->
    <link rel="canonical" href="https://rokarpos.co.uk/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      Fonts are self-hosted subsets, generated by build/build_fonts.py.
      This used to be a <link> to fonts.googleapis.com with a preconnect to two
      extra origins; dropping it removes a DNS lookup, two TLS handshakes and a
      third-party request from the critical path, and with it the visitor's IP
      and referrer no longer go to Google.

      Only the two faces used above the fold are preloaded. Noto Nastaliq Urdu
      is 147 KB and appears solely in the footer, the step list, the industry
      cards and the receipt modal, so preloading it would steal bandwidth from
      the first paint to render text most visitors never scroll to.

      The block between the markers is rewritten by `npm run fonts`, because the
      filenames are content-hashed and would otherwise go stale here on every
      rebuild that changes a glyph outline. Edit build_fonts.py, not this.
    -->
    <!-- @fonts:preload -->
    <link rel="preload" href="/fonts/plus-jakarta-sans-40ffb41ae3.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fraunces-b280364b6b.woff2" as="font" type="font/woff2" crossorigin />
    <!-- /@fonts:preload -->

    <!--
      Structured data is generated at build time from src/content.json by the
      rokar-seo plugin in vite.config.ts, so the FAQ schema can never drift away
      from the questions the page actually shows. Edit content.json, not this.
    -->
    <!--@seo:jsonld-->
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="root"></div>
    <!--@seo:noscript-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
